services:
  gostats:
    image: ${GOSTATS_IMAGE:-ghcr.io/liueic/gostats:latest}
    pull_policy: always
    container_name: gostats
    restart: unless-stopped
    init: true

    ports:
      - "8080:8080"

    environment:
      CONFIG_FILE: /config.yml

    volumes:
      - ./config.yml:/config.yml:ro
      - ./data:/data

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
